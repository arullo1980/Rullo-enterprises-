name = "rullo-reloadly-proxy"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Non-secret config only.
#   "mock"    — fixture data, no Reloadly account needed. For local development.
#   "sandbox" — Reloadly's test environment. No real money moves.
#   "live"    — production.
# Sandbox and live use SEPARATE credentials; the mode must match the keys.
[vars]
RELOADLY_ENV = "sandbox"

# Extra browser origins allowed to call this Worker, comma-separated. The
# production domains are already built in; add a GitHub Pages preview or a
# local dev server here rather than editing the code.
# ALLOWED_ORIGINS = "http://localhost:8080,https://arullo1980.github.io"

[observability]
enabled = true

# Secrets are NEVER put in this file. Set them once, encrypted, in Cloudflare:
#   npx wrangler secret put RELOADLY_CLIENT_ID
#   npx wrangler secret put RELOADLY_CLIENT_SECRET

# Optional: serve from your own subdomain instead of *.workers.dev.
# This adds only the `api` subdomain to Cloudflare's proxy — it does NOT
# touch the apex records that point at GitHub Pages.
# [[routes]]
# pattern = "api.rulloenterprises.com"
# custom_domain = true
