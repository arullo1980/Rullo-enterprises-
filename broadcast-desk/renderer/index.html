<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0E7C55" />
  <title>Broadcast Desk — Rullo Enterprises</title>
  <meta name="description" content="Multi-account social operations console: profiles, message generator, simultaneous posting, scheduling, and ad-hoc automation rules." />

  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />

  <link rel="stylesheet" href="./css/app.css" />
  <script>
    // Set the theme before first paint so the console never flashes.
    try {
      var t = localStorage.getItem('bd.theme');
      if (!t || t === 'system') {
        t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>

  <div id="app">
    <aside class="rail" id="rail">
      <div class="rail-brand">
        <span class="rail-mark" aria-hidden="true">BD</span>
        <span>
          <strong>Broadcast Desk</strong>
          <span>Rullo Enterprises</span>
        </span>
      </div>

      <div class="rail-scope">
        <label for="scope">Working profile</label>
        <select id="scope" aria-label="Working profile"></select>
      </div>

      <nav class="rail-nav" id="nav" aria-label="Sections"></nav>

      <div class="rail-foot">
        <button class="btn btn-sm btn-ghost" id="themeBtn" title="Toggle light / dark">Theme</button>
        <span class="spacer"></span>
        <span class="badge" id="connState" title="Backend connection">local</span>
      </div>
    </aside>

    <!-- #viewScope is replaced wholesale on every navigation: it carries both the
         top bar and the view body, so a view's delegated handlers reach its
         top-bar buttons and cannot survive into the next view. -->
    <div class="main" id="viewScope"></div>
  </div>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  <dialog id="modal"></dialog>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
