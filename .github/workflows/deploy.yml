name: Deploy site to GitHub Pages

# Publishes the contents of site/ to GitHub Pages on every push to main.
# Once this runs, rulloenterprises.com serves the storefront automatically —
# no manual uploads, ever. Future edits deploy themselves.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes supersede in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Try to enable Pages (source = GitHub Actions) automatically, so
          # there's no manual toggle. If your account blocks API enablement,
          # flip Settings → Pages → Source to "GitHub Actions" and re-run.
          enablement: true

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
